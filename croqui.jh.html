<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Croqui de Rotas de Cabos - Telecom Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 12px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        #btn-gps { background-color: #2ecc71; color: white; }
        #btn-undo { background-color: #f39c12; color: white; }
        #btn-clear { background-color: #e74c3c; color: white; }
        
        #painel-info {
            background: #34495e;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            border-left: 5px solid #3498db;
        }
        .destaque {
            color: #f1c40f;
            font-weight: bold;
        }
        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="btn-group">
            <button id="btn-gps" onclick="capturarGPS()">📍 Atualizar Meu GPS</button>
            <button id="btn-undo" onclick="desfazerUltimo()">↩️ Desfazer Ponto</button>
            <button id="btn-clear" onclick="limparRota()">🗑️ Limpar Tudo</button>
        </div>
        
        <div id="painel-info">
            <strong>📍 Seu Ponto Exato:</strong> <span id="endereco-local">Buscando localização...</span><br>
            <strong>🌐 Coordenadas:</strong> <span id="coordenadas-local">---</span> | 
            <strong>📏 Cabo Total:</strong> <span id="distancia" class="destaque">0</span> <span class="destaque">metros</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Inicializa o mapa padrão
        const map = L.map('map').setView([-15.7801, -47.9292], 4);

        // Adiciona o mapa do OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let listaPontos = [];
        let camadaLinha = null;
        let marcadores = []; 
        let marcadorGPS = null;

        // Função principal para capturar GPS e carregar dados locais externos
        function capturarGPS() {
            if (!navigator.geolocation) {
                document.getElementById('endereco-local').innerText = "Geolocalização não suportada.";
                return;
            }

            document.getElementById('endereco-local').innerText = "Obtendo sinal do satélite...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    // Exibe as coordenadas na tela
                    document.getElementById('coordenadas-local').innerText = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;

                    // Foca o mapa na precisão máxima
                    map.setView([lat, lng], 18);

                    // Atualiza marcador visual do técnico em campo
                    if (marcadorGPS) {
                        marcadorGPS.setLatLng([lat, lng]);
                    } else {
                        marcadorGPS = L.marker([lat, lng], {
                            title: "Você está aqui"
                        }).addTo(map);
                    }

                    // Chamar API para carregar informações do local (Endereço, Rua, Bairro)
                    buscarInformacoesLocais(lat, lng);
                },
                (error) => {
                    document.getElementById('endereco-local').innerText = "Erro ao acessar o GPS.";
                    alert("Erro ao obter GPS: " + error.message);
                },
                { enableHighAccuracy: true } // Força o uso do GPS de alta precisão do celular
            );
        }

        // Consulta dinâmica ao servidor OpenStreetMap para obter dados da rua/bairro
        function buscarInformacoesLocais(lat, lng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.address) {
                        const rua = data.address.road || "Rua não identificada";
                        const numero = data.address.house_number || "S/N";
                        const bairro = data.address.suburb || data.address.neighbourhood || "Bairro não mapeado";
                        const cidade = data.address.city || data.address.town || "";
                        
                        // Atualiza o painel com as informações reais da rua de telecom
                        document.getElementById('endereco-local').innerHTML = `${rua}, Nº ${numero} - <strong>${bairro}</strong>, ${cidade}`;
                        marcadorGPS.bindPopup(`<b>Seu ponto de partida:</b><br>${rua}, ${numero}`).openPopup();
                    } else {
                        document.getElementById('endereco-local').innerText = "Endereço não localizado no mapa.";
                    }
                })
                .catch(err => {
                    document.getElementById('endereco-local').innerText = "Erro ao carregar dados locais (Sem internet?).";
                });
        }

        function redesenharLinha() {
            if (camadaLinha) {
                map.removeLayer(camadaLinha);
                camadaLinha = null;
            }

            if (listaPontos.length > 1) {
                camadaLinha = L.polyline(listaPontos, {
                    color: 'red', 
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '5, 10'
                }).addTo(map);
            }
            atualizarDistancia();
        }

        // Adicionar cliques/toques para desenhar os cabos
        map.on('click', function(e) {
            const latlng = e.latlng;
            listaPontos.push(latlng);

            const marker = L.circleMarker(latlng, {
                radius: 7,
                fillColor: "#3498db",
                color: "#000",
                weight: 1,
                fillOpacity: 0.9
            }).addTo(map);

            // Permite remover o ponto se clicar acidentalmente nele
            marker.on('click', function(event) {
                L.DomEvent.stopPropagation(event);
                removerPontoEspecifico(latlng, marker);
            });

            marcadores.push(marker);
            redesenharLinha();
        });

        function removerPontoEspecifico(latlng, marker) {
            map.removeLayer(marker);
            const index = listaPontos.indexOf(latlng);
            if (index > -1) {
                listaPontos.splice(index, 1);
                marcadores.splice(index, 1);
            }
            redesenharLinha();
        }

        function desfazerUltimo() {
            if (listaPontos.length === 0) return;
            const ultimoMarcador = marcadores.pop();
            if (ultimoMarcador) map.removeLayer(ultimoMarcador);
            listaPontos.pop();
            redesenharLinha();
        }

        function atualizarDistancia() {
            let distanciaTotal = 0;
            for (let i = 0; i < listaPontos.length - 1; i++) {
                distanciaTotal += listaPontos[i].distanceTo(listaPontos[i+1]);
            }
            document.getElementById('
