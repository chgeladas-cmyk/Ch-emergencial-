<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CH Geladas — Financeiro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap');
  :root{--bg:#08090d;--bg2:#0f1117;--bg3:#161820;--border:rgba(255,255,255,.07);--text:#e8eaf0;--muted:#5a5f72;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100dvh;}
  h1,h2{font-family:'Syne',sans-serif;}
  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  header h1{font-size:1.1rem;font-weight:800;}header h1 span{color:var(--green);}
  main{padding:1rem;}
  .btn{border:none;border-radius:.7rem;cursor:pointer;font-family:'Syne',sans-serif;font-size:.82rem;font-weight:700;padding:.7rem 1rem;transition:opacity .15s,transform .1s;width:100%;}
  .btn:active{transform:scale(.97);}
  .btn-green{background:var(--green);color:#000;}
  .btn-red{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);}
  .btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border);}
  .btn-blue{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3);}
  .btn-sm{padding:.4rem .8rem;font-size:.72rem;width:auto;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:1rem;padding:1rem;margin-bottom:.75rem;}
  .card-title{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.75rem;}
  .form-row{margin-bottom:.75rem;}
  .form-row label{display:block;font-size:.68rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.3rem;}
  .form-row input,.form-row select,.form-row textarea{background:var(--bg3);border:1px solid var(--border);border-radius:.6rem;color:var(--text);font-size:.9rem;font-family:'DM Sans',sans-serif;padding:.6rem .8rem;width:100%;outline:none;appearance:none;}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--green);}
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
  /* SALDO */
  .saldo-box{background:linear-gradient(135deg,rgba(34,197,94,.08),rgba(34,197,94,.03));border:1px solid rgba(34,197,94,.15);border-radius:1.2rem;padding:1.25rem;margin-bottom:.75rem;text-align:center;}
  .saldo-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;}
  .saldo-val{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;}
  .saldo-pos{color:var(--green);}
  .saldo-neg{color:var(--red);}
  .saldo-sub{display:flex;gap:1rem;justify-content:center;margin-top:.75rem;}
  .saldo-sub-item{text-align:center;}
  .saldo-sub-label{font-size:.62rem;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .saldo-sub-val{font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;}
  /* FILTRO */
  .filtro{display:flex;gap:.5rem;align-items:center;margin-bottom:.75rem;}
  .filtro input{background:var(--bg2);border:1px solid var(--border);border-radius:.7rem;color:var(--text);font-size:.88rem;font-family:'DM Sans',sans-serif;padding:.6rem .8rem;flex:1;outline:none;}
  .filtro input:focus{border-color:var(--green);}
  /* TIPO SELECTOR */
  .tipo-sel{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem;}
  .tipo-btn{background:var(--bg3);border:1px solid var(--border);border-radius:.7rem;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;font-size:.78rem;font-weight:700;padding:.65rem;text-align:center;transition:all .15s;}
  .tipo-btn.rec.sel{background:rgba(34,197,94,.12);border-color:var(--green);color:var(--green);}
  .tipo-btn.des.sel{background:rgba(239,68,68,.12);border-color:var(--red);color:var(--red);}
  /* LISTA */
  .lanc-item{display:flex;align-items:center;gap:.6rem;padding:.7rem 0;border-bottom:1px solid var(--border);}
  .lanc-item:last-child{border-bottom:none;}
  .lanc-tipo{font-size:1.1rem;flex-shrink:0;}
  .lanc-info{flex:1;min-width:0;}
  .lanc-desc{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lanc-sub{font-size:.7rem;color:var(--muted);margin-top:.1rem;}
  .lanc-val{font-family:'Syne',sans-serif;font-weight:800;font-size:.95rem;min-width:72px;text-align:right;flex-shrink:0;}
  .val-rec{color:var(--green);}
  .val-des{color:var(--red);}
  .lanc-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.85rem;padding:.2rem .4rem;flex-shrink:0;}
  /* GRÁFICO SIMPLES */
  .barra-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.4rem;}
  .barra-label{font-size:.72rem;color:var(--muted);width:70px;flex-shrink:0;text-align:right;}
  .barra-track{flex:1;background:var(--bg3);border-radius:2rem;height:8px;overflow:hidden;}
  .barra-fill{height:100%;border-radius:2rem;transition:width .4s;}
  .barra-val{font-family:'Syne',sans-serif;font-size:.72rem;font-weight:700;min-width:60px;text-align:right;}
  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;padding:1rem;opacity:0;pointer-events:none;transition:opacity .2s;}
  .overlay.show{opacity:1;pointer-events:all;}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:1.2rem;padding:1.25rem;width:100%;transform:translateY(30px);transition:transform .25s;max-height:90dvh;overflow-y:auto;}
  .overlay.show .modal{transform:translateY(0);}
  .modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;margin-bottom:1rem;}
  .modal-btns{display:flex;gap:.5rem;margin-top:1rem;}
  .modal-btns .btn{flex:1;}
  /* TOAST */
  #toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--bg3);border:1px solid var(--border);border-radius:.85rem;padding:.7rem 1.2rem;font-size:.82rem;font-weight:600;z-index:999;white-space:nowrap;transition:transform .25s;box-shadow:0 8px 32px rgba(0,0,0,.5);}
  #toast.show{transform:translateX(-50%) translateY(0);}
  #toast.ok{border-color:rgba(34,197,94,.3);color:var(--green);}
  #toast.err{border-color:rgba(239,68,68,.3);color:var(--red);}
  .empty{color:var(--muted);text-align:center;padding:2rem;font-size:.85rem;}
  .sep{height:1px;background:var(--border);margin:.5rem 0;}
  .cat-chip{display:inline-block;font-size:.62rem;font-weight:700;background:rgba(168,85,247,.12);color:var(--purple);border:1px solid rgba(168,85,247,.2);border-radius:.3rem;padding:.1rem .4rem;}
</style>
</head>
<body>
<header>
  <h1>💹 <span>Financeiro</span></h1>
  <button class="btn btn-ghost btn-sm" onclick="copiarRelatorio()">📋 Copiar</button>
</header>
<main>
  <!-- SALDO GERAL -->
  <div class="saldo-box">
    <div class="saldo-label">Saldo Total</div>
    <div class="saldo-val" id="saldoVal">R$0,00</div>
    <div class="saldo-sub">
      <div class="saldo-sub-item"><div class="saldo-sub-label">Receitas</div><div class="saldo-sub-val" id="totalRec" style="color:var(--green)">R$0,00</div></div>
      <div class="saldo-sub-item"><div class="saldo-sub-label">Despesas</div><div class="saldo-sub-val" id="totalDes" style="color:var(--red)">R$0,00</div></div>
    </div>
  </div>

  <!-- FILTRO -->
  <div class="filtro">
    <input type="month" id="filtMes" onchange="render()">
    <button class="btn btn-ghost btn-sm" onclick="setMesAtual();render()">Mês atual</button>
  </div>

  <!-- AÇÕES -->
  <div class="form-2col" style="margin-bottom:.75rem">
    <button class="btn btn-green" onclick="abrirLanc('receita')">+ Receita</button>
    <button class="btn btn-red" onclick="abrirLanc('despesa')">− Despesa</button>
  </div>

  <!-- RESUMO MÊS -->
  <div class="card" id="resumoMes"></div>

  <!-- GRÁFICO POR CATEGORIA -->
  <div class="card" id="grafCat" style="display:none">
    <div class="card-title">Por Categoria — Despesas</div>
    <div id="grafContent"></div>
  </div>

  <!-- LISTA -->
  <div class="card">
    <div class="card-title" id="listaTitulo">Lançamentos</div>
    <div id="lista"></div>
  </div>
</main>

<!-- Modal Lançamento -->
<div class="overlay" id="mLanc">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="mLancTitle">Novo Lançamento</div>
    <div class="tipo-sel">
      <button type="button" id="btnRec" class="tipo-btn rec sel" onclick="setTipo('receita')">✅ Receita</button>
      <button type="button" id="btnDes" class="tipo-btn des" onclick="setTipo('despesa')">❌ Despesa</button>
    </div>
    <div class="form-row"><label>Descrição</label><input id="lDesc" placeholder="Ex: Venda do dia, Compra de estoque..."></div>
    <div class="form-row"><label>Valor (R$)</label><input id="lVal" type="number" step="0.01" min="0" placeholder="0.00"></div>
    <div class="form-row"><label>Categoria</label>
      <select id="lCat">
        <option value="">— Selecione —</option>
        <optgroup label="Receitas"><option>Vendas</option><option>Outros</option></optgroup>
        <optgroup label="Despesas"><option>Compra de estoque</option><option>Aluguel</option><option>Energia</option><option>Água</option><option>Funcionário</option><option>Transporte</option><option>Embalagem</option><option>Marketing</option><option>Manutenção</option><option>Outros</option></optgroup>
      </select>
    </div>
    <div class="form-2col">
      <div class="form-row"><label>Data</label><input id="lData" type="date"></div>
      <div class="form-row"><label>Hora</label><input id="lHora" type="time"></div>
    </div>
    <div class="form-row"><label>Observação</label><input id="lObs" placeholder="Opcional..."></div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="fechar('mLanc')">Cancelar</button>
      <button class="btn btn-green" onclick="salvarLanc()">Salvar</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script>
'use strict';
const KEY='CHE2_FINANCEIRO';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]');}catch{return[];}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch{toast('Armazenamento cheio','err');}}
function uid(){return crypto.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);}
function fmt(v){return 'R$'+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function hoje(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function horaAgora(){return new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function mesAtual(){return new Date().toISOString().slice(0,7);}
function horaFmt(){return new Date().toLocaleString('pt-BR');}
let _t=null;
function toast(m,t='ok'){const e=document.getElementById('toast');e.textContent=m;e.className='show '+t;clearTimeout(_t);_t=setTimeout(()=>e.className='',2500);}
function abrir(id){document.getElementById(id).classList.add('show');}
function fechar(id){document.getElementById(id).classList.remove('show');}
function setMesAtual(){document.getElementById('filtMes').value=mesAtual();}

let _tipo='receita';
function setTipo(t){
  _tipo=t;
  document.getElementById('btnRec').classList.toggle('sel',t==='receita');
  document.getElementById('btnDes').classList.toggle('sel',t==='despesa');
}

function abrirLanc(tipo){
  _tipo=tipo;
  document.getElementById('mLancTitle').textContent=tipo==='receita'?'Nova Receita':'Nova Despesa';
  setTipo(tipo);
  ['lDesc','lVal','lObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('lCat').value='';
  document.getElementById('lData').value=hoje();
  document.getElementById('lHora').value=horaAgora();
  abrir('mLanc');
}

function salvarLanc(){
  const val=parseFloat(document.getElementById('lVal').value)||0;
  const desc=document.getElementById('lDesc').value.trim();
  if(!val){toast('Informe o valor','err');return;}
  if(!desc){toast('Informe a descrição','err');return;}
  const lanc={
    id:uid(), tipo:_tipo, desc,
    valor:val,
    cat:document.getElementById('lCat').value,
    obs:document.getElementById('lObs').value.trim(),
    data:document.getElementById('lData').value||hoje(),
    hora:document.getElementById('lHora').value||horaAgora(),
    criadoEm:new Date().toISOString(),
  };
  const d=load();d.unshift(lanc);save(d);
  fechar('mLanc');render();renderSaldoGeral();
  toast(`${_tipo==='receita'?'Receita':'Despesa'} de ${fmt(val)} salva ✓`);
}

function excluir(id){
  if(!confirm('Excluir este lançamento?'))return;
  save(load().filter(l=>l.id!==id));render();renderSaldoGeral();toast('Excluído');
}

function getMes(){return document.getElementById('filtMes').value||mesAtual();}

function renderSaldoGeral(){
  const d=load();
  const rec=d.filter(l=>l.tipo==='receita').reduce((s,l)=>s+l.valor,0);
  const des=d.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+l.valor,0);
  const saldo=rec-des;
  const sv=document.getElementById('saldoVal');
  sv.textContent=fmt(saldo);
  sv.className='saldo-val '+(saldo>=0?'saldo-pos':'saldo-neg');
  document.getElementById('totalRec').textContent=fmt(rec);
  document.getElementById('totalDes').textContent=fmt(des);
}

function render(){
  const mes=getMes();
  const d=load().filter(l=>l.data&&l.data.slice(0,7)===mes);
  const rec=d.filter(l=>l.tipo==='receita').reduce((s,l)=>s+l.valor,0);
  const des=d.filter(l=>l.tipo==='despesa').reduce((s,l)=>s+l.valor,0);
  const saldo=rec-des;
  const mesFmt=mes.split('-').reverse().join('/');
  document.getElementById('listaTitulo').textContent=`Lançamentos — ${mesFmt} (${d.length})`;

  // Resumo mês
  document.getElementById('resumoMes').innerHTML=`
    <div class="card-title">Resumo — ${mesFmt}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem">
      <div style="background:var(--bg3);border-radius:.75rem;padding:.7rem .5rem;text-align:center">
        <div style="font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:.3rem">Receitas</div>
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:var(--green)">${fmt(rec)}</div>
      </div>
      <div style="background:var(--bg3);border-radius:.75rem;padding:.7rem .5rem;text-align:center">
        <div style="font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:.3rem">Despesas</div>
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:var(--red)">${fmt(des)}</div>
      </div>
      <div style="background:var(--bg3);border-radius:.75rem;padding:.7rem .5rem;text-align:center">
        <div style="font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:.3rem">Saldo</div>
        <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:.9rem;color:${saldo>=0?'var(--green)':'var(--red)'}">${fmt(saldo)}</div>
      </div>
    </div>`;

  // Gráfico por categoria (despesas)
  const despesas=d.filter(l=>l.tipo==='despesa');
  const porCat={};
  despesas.forEach(l=>{ const c=l.cat||'Outros'; porCat[c]=(porCat[c]||0)+l.valor; });
  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const grafCard=document.getElementById('grafCat');
  if(cats.length){
    grafCard.style.display='block';
    const max=cats[0][1];
    document.getElementById('grafContent').innerHTML=cats.map(([c,v])=>`
      <div class="barra-row">
        <div class="barra-label">${c.length>10?c.slice(0,9)+'…':c}</div>
        <div class="barra-track"><div class="barra-fill" style="width:${(v/max*100).toFixed(0)}%;background:var(--red);opacity:.7"></div></div>
        <div class="barra-val" style="color:var(--red)">${fmt(v)}</div>
      </div>`).join('');
  } else grafCard.style.display='none';

  // Lista
  const lista=document.getElementById('lista');
  if(!d.length){lista.innerHTML='<div class="empty">Nenhum lançamento neste mês</div>';return;}
  lista.innerHTML=d.map(l=>`
    <div class="lanc-item">
      <span class="lanc-tipo">${l.tipo==='receita'?'✅':'❌'}</span>
      <div class="lanc-info">
        <div class="lanc-desc">${l.desc}</div>
        <div class="lanc-sub">${l.data.split('-').reverse().join('/')} ${l.hora} ${l.cat?'· '+l.cat:''} ${l.obs?'· '+l.obs:''}</div>
      </div>
      <div class="lanc-val ${l.tipo==='receita'?'val-rec':'val-des'}">${l.tipo==='receita'?'+':'-'} ${fmt(l.valor)}</div>
      <button class="lanc-del" onclick="excluir('${l.id}')">✕</button>
    </div>`).join('');
}

function copiarRelatorio(){
  const mes=getMes();
  const d=load().filter(l=>l.data&&l.data.slice(0,7)===mes);
  const rec=d.filter(l=>l.tipo==='receita');
  const des=d.filter(l=>l.tipo==='despesa');
  const totalRec=rec.reduce((s,l)=>s+l.valor,0);
  const totalDes=des.reduce((s,l)=>s+l.valor,0);
  const saldo=totalRec-totalDes;
  const mesFmt=mes.split('-').reverse().join('/');
  // Por categoria de despesa
  const porCat={};
  des.forEach(l=>{const c=l.cat||'Outros';porCat[c]=(porCat[c]||0)+l.valor;});

  let txt=`💹 RELATÓRIO FINANCEIRO\n${mesFmt} — ${horaFmt()}\n${'─'.repeat(30)}\n\n`;
  txt+=`💰 RESUMO:\n  ✅ Receitas:  ${fmt(totalRec)}\n  ❌ Despesas: ${fmt(totalDes)}\n  📊 Saldo:    ${fmt(saldo)}\n\n`;
  if(Object.keys(porCat).length){
    txt+=`📂 Despesas por categoria:\n`;
    Object.entries(porCat).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>txt+=`  ${c}: ${fmt(v)}\n`);
    txt+='\n';
  }
  txt+=`${'─'.repeat(30)}\n✅ RECEITAS (${rec.length}):\n`;
  rec.forEach(l=>txt+=`  ${l.data.split('-').reverse().join('/')} ${l.hora} — ${l.desc}: +${fmt(l.valor)}\n`);
  txt+=`\n❌ DESPESAS (${des.length}):\n`;
  des.forEach(l=>txt+=`  ${l.data.split('-').reverse().join('/')} ${l.hora} — ${l.desc}${l.cat?' ('+l.cat+')':''}: -${fmt(l.valor)}\n`);

  navigator.clipboard.writeText(txt).then(()=>toast('Relatório copiado ✓')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;ta.style='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Relatório copiado ✓');
  });
}

setMesAtual();
renderSaldoGeral();
render();
</script>
</body>
</html>
