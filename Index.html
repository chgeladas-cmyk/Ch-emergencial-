<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom GPS - Modo Caminhada</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #controls {
            padding: 12px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            flex: 1;
            min-width: 120px;
        }
        #btn-gps { background-color: #2ecc71; color: white; }
        #btn-fixar { background-color: #3498db; color: white; font-size: 15px; box-shadow: 0 0 10px rgba(52, 152, 219, 0.5); }
        #btn-undo { background-color: #f39c12; color: white; }
        #btn-clear { background-color: #e74c3c; color: white; }
        
        #painel-info {
            background: #34495e;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
            border-left: 5px solid #3498db;
        }
        .destaque {
            color: #f1c40f;
            font-weight: bold;
        }
        #map {
            flex: 1;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="controls">
        <div class="btn-group">
            <button id="btn-gps" onclick="capturarGPS()">📍 1. Atualizar GPS</button>
            <button id="btn-fixar" onclick="fixarPosteNoGPS()">📌 2. Fixar Poste Aqui</button>
        </div>
        <div class="btn-group">
            <button id="btn-undo" onclick="desfazerUltimo()">↩️ Desfazer</button>
            <button id="btn-clear" onclick="limparRota()">🗑️ Limpar Tudo</button>
        </div>
        
        <div id="painel-info">
            <strong>📍 Ponto do GPS:</strong> <span id="endereco-local">Buscando localização...</span><br>
            <strong>🌐 Coordenadas:</strong> <span id="coordenadas-local">---</span> | 
            <strong>📏 Cabo Total:</strong> <span id="distancia" class="destaque">0</span> <span class="destaque">metros</span>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map').setView([-15.7801, -47.9292], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let listaPontos = [];
        let camadaLinha = null;
        let marcadores = []; 
        let marcadorGPS = null;
        let ultimaCoordenadaGPS = null; // Guarda a posição atual detectada pelo satélite

        // 1. Atualiza a posição onde você está pisando no momento
        function capturarGPS() {
            if (!navigator.geolocation) {
                document.getElementById('endereco-local').innerText = "Geolocalização não suportada.";
                return;
            }

            document.getElementById('endereco-local').innerText = "Buscando sinal do satélite...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    // Salva a coordenada para uso do botão "Fixar"
                    ultimaCoordenadaGPS = L.latLng(lat, lng);
                    
                    document.getElementById('coordenadas-local').innerText = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
                    map.setView([lat, lng], 19);

                    if (marcadorGPS) {
                        marcadorGPS.setLatLng([lat, lng]);
                    } else {
                        // Marcador vermelho com ícone de "alvo" para o técnico em movimento
                        marcadorGPS = L.marker([lat, lng]).addTo(map);
                    }

                    buscarInformacoesLocais(lat, lng);
                },
                (error) => {
                    document.getElementById('endereco-local').innerText = "Erro ao acessar o GPS.";
                    alert("Erro ao obter GPS: " + error.message);
                },
                { 
                    enableHighAccuracy: true, // Aciona o GPS de alta precisão do hardware
                    timeout: 10000 
                }
            );
        }

        // 2. Transforma a sua localização atual em um ponto da rota do cabo
        function fixarPosteNoGPS() {
            if (!ultimaCoordenadaGPS) {
                alert("Por favor, clique primeiro em '1. Atualizar GPS' para encontrar sua posição atual.");
                return;
            }

            const latlng = ultimaCoordenadaGPS;
            listaPontos.push(latlng);

            // Cria a bolinha do poste no mapa
            const marker = L.circleMarker(latlng, {
                radius: 8,
                fillColor: "#e67e22", // Laranja para destacar os postes fixados
                color: "#000",
                weight: 2,
                fillOpacity: 1
            }).addTo(map);

            // Se clicar no poste por engano, ele ainda pode ser removido individualmente
            marker.on('click', function(event) {
                L.DomEvent.stopPropagation(event);
                removerPontoEspecifico(latlng, marker);
            });

            marcadores.push(marker);
            redesenharLinha();
            
            // Emite um pequeno aviso sonoro ou alerta visual rápido para confirmar o registro em campo
            document.getElementById('info').insertAdjacentHTML('beforeend', ' <span style="color:#2ecc71">✓</span>');
        }

        function buscarInformacoesLocais(lat, lng) {
            const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.address) {
                        const rua = data.address.road || "Rua não identificada";
                        const bairro = data.address.suburb || data.address.neighbourhood || "";
                        document.getElementById('endereco-local').innerHTML = `${rua} - <strong>${bairro}</strong>`;
                    }
                }).catch(() => {});
        }

        function redesenharLinha() {
            if (camadaLinha) map.removeLayer(camadaLinha);

            if (listaPontos.length > 1) {
                camadaLinha = L.polyline(listaPontos, {
                    color: '#e74c3c', 
                    weight: 5,
                    opacity: 0.9,
                    dashArray: '6, 12' // Estilo tracejado de fibra/cabo de telecom
                }).addTo(map);
            }
            atualizarDistancia();
        }

        // Mantém a opção de clicar na tela caso você queira adicionar um poste manualmente à distância
        map.on('click', function(e) {
            ultimaCoordenadaGPS = e.latlng;
            fixarPosteNoGPS();
        });

        function removerPontoEspecifico(latlng, marker) {
            map.removeLayer(marker);
            const index = listaPontos.indexOf(latlng);
            if (index > -1) {
                listaPontos.splice(index, 1);
                marcadores.splice(index, 1);
            }
            redesenharLinha();
        }

        function desfazerUltimo() {
            if (listaPontos.length === 0) return;
            const ultimoMarcador = marcadores.pop();
            if (ultimoMarcador) map.removeLayer(ultimoMarcador);
            listaPontos.pop();
            redesenharLinha();
        }

        function atualizarDistancia() {
            let distanciaTotal = 0;
            for (let i = 0; i < listaPontos.length - 1; i++) {
                distanciaTotal += listaPontos[i].distanceTo(listaPontos[i+1]);
            }
            document.getElementById('distancia').innerText = distanciaTotal.toFixed(2);
        }

        function limparRota() {
            listaPontos = [];
            if (camadaLinha) { map.removeLayer(camadaLinha); camadaLinha = null; }
            marcadores.forEach(m => map.removeLayer(m));
            marcadores = [];
            document.getElementById('distancia').innerText = "0";
        }

        window.onload = capturarGPS;
    </script>
</body>
</html>
